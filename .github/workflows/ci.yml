name: CI

on:
  push:
    branches: [master, 'security/**']
  pull_request:
    branches: [master, 'security/**']

jobs:
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estrategos
          POSTGRES_PASSWORD: estrategos
          POSTGRES_DB: estrategos_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U estrategos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://estrategos:estrategos@localhost:5432/estrategos_ci
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
        working-directory: apps/api
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run lint
        working-directory: apps/api
      - run: npm run test
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
