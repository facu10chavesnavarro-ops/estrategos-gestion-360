# Levanta Estrategos Gestión 360 completo (Postgres + API + Web) para
# validar un build de producción localmente, o como base para un
# despliegue de un solo servidor (VPS) vía docker-compose.
#
# Uso:
#   cp apps/api/.env.example apps/api/.env.production
#   cp apps/web/.env.example apps/web/.env.production
#   # completar apps/api/.env.production y apps/web/.env.production con
#   # valores reales (secretos largos, NEXT_PUBLIC_API_URL real, etc.)
#   docker compose up --build
#
# Ver DEPLOY.md para el detalle de cada variable y el checklist completo.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estrategos
      POSTGRES_PASSWORD: estrategos
      POSTGRES_DB: estrategos
    volumes:
      - estrategos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estrategos"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Expuesto solo para inspección manual (psql, backups) — la app se
      # conecta por la red interna de docker compose, no por este puerto.
      - "5432:5432"

  # Aplica las migraciones pendientes y termina — la API no arranca hasta
  # que este servicio sale con éxito (depends_on condition abajo).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env.production
    environment:
      DATABASE_URL: postgresql://estrategos:estrategos@postgres:5432/estrategos
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env.production
    environment:
      DATABASE_URL: postgresql://estrategos:estrategos@postgres:5432/estrategos
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Docker build args no leen env_file — si tu API no vive en
        # localhost:3001, pasala explícitamente:
        #   docker compose build --build-arg NEXT_PUBLIC_API_URL=https://api.tu-dominio.com web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file:
      - apps/web/.env.production
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  estrategos_postgres_data:
